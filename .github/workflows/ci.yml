name: Pull request CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.21.0'
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.5.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Remove allowlisted generated artifacts
        run: pnpm clean
      - name: Verify CI workflow contract
        run: pnpm ci:contract
      - name: Verify secret-protection hooks
        run: pnpm secret-hooks:check
      - name: Verify generated API contract stability
        run: pnpm generated:verify
      - name: Typecheck from a clean output tree
        run: pnpm exec turbo run typecheck --force
      - name: Check formatting
        run: pnpm format:check
      - name: Lint, test, and build without cache replay
        run: pnpm exec turbo run lint test:unit build --force
      - name: Reject high production dependency advisories
        run: pnpm audit --prod --audit-level=high

  postgresql:
    name: PostgreSQL migration contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.21.0'
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.5.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify migrations, seed, PostgreSQL API, and rollback
        run: pnpm test:catalog:postgres
      - name: Verify secure registration migration and constraints
        run: pnpm test:a1:postgres
      - name: Verify session migration, constraints, and concurrency
        run: pnpm test:a1b:postgres
      - name: Verify customer-profile migration, constraints, and atomic updates
        run: pnpm test:a4:postgres
      - name: Verify administrator provisioning and current-principal authorization
        run: pnpm test:m1:postgres
      - name: Verify admin product lifecycle migration, listing, and rollback
        run: pnpm test:m2:postgres
      - name: Verify guest cart migration, constraints, and concurrency
        run: pnpm test:o0:postgres
      - name: Verify account cart ownership, merge, isolation, and concurrency
        run: pnpm test:o1a:postgres
      - name: Verify cart reservation migration, lifecycle, and concurrency
        run: pnpm test:o1b:postgres
      - name: Verify transactional order migration, lifecycle, and concurrency
        run: pnpm test:o2:postgres
      - name: Verify measured quantities, pricing, backfills, and checkout
        run: pnpm test:o2q:postgres
      - name: Verify the A1B Argon2 resource profile
        run: pnpm test:a1b:argon2:alpine

  browser:
    name: Connected and unavailable browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: hb-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.21.0'
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.5.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned Chromium runtime
        run: pnpm --filter @hop-and-barley/e2e exec playwright install --with-deps chromium
      - name: Configure disposable browser stack settings
        run: node scripts/configure-ci-browser-env.mjs
      - name: Start the isolated full stack
        run: docker compose up -d --build --wait
      - name: Provision the isolated browser-test administrator
        run: docker compose exec -T -e HB_LOCAL_ADMIN_PASSWORD api node dist/seed/scripts/provision-local-admin.js
      - name: Test the connected storefront
        run: pnpm --filter @hop-and-barley/e2e test:e2e
      - name: Remove only the isolated API service
        run: |
          docker compose stop api
          docker compose rm --force api
      - name: Start a delayed unavailable API stub
        run: |
          docker run --detach --rm \
            --name "${COMPOSE_PROJECT_NAME}-delayed-api" \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            --network-alias api \
            node:24.5.0-alpine \
            node -e 'require("http").createServer((_request,response)=>setTimeout(()=>{response.statusCode=503;response.end("delayed unavailable")},2000)).listen(3001,"0.0.0.0")'
      - name: Recreate a cold storefront for the unavailable phase
        run: |
          docker compose rm --stop --force web
          docker compose up -d --no-deps web
          for attempt in {1..30}; do
            hb_web_health=$(docker inspect --format '{{.State.Health.Status}}' "${COMPOSE_PROJECT_NAME}-web-1" 2>/dev/null || true)
            if [ "$hb_web_health" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps -a
          exit 1
      - name: Test the safe API-unavailable storefront
        run: E2E_EXPECT_API_STATUS='API unavailable' pnpm --filter @hop-and-barley/e2e test:e2e
      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop the delayed unavailable API stub
        if: always()
        run: docker rm --force "${COMPOSE_PROJECT_NAME}-delayed-api" 2>/dev/null || true
      - name: Stop isolated services
        if: always()
        run: docker compose down --remove-orphans
