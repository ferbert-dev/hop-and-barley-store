packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@nestjs/swagger>js-yaml': 5.2.2
  '@prisma/config>deepmerge-ts': 8.0.0
  'ajv>fast-uri': 3.1.6
  multer: 2.3.0
  'prisma>mysql2': 3.22.6

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.4'
  - '@next/eslint-plugin-next@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - eslint-config-next@16.3.4
  - multer@2.3.0
  - next@16.3.4
  - sharp@0.35.4
