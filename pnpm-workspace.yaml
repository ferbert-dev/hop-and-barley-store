packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@nestjs/swagger>js-yaml': 5.2.2
  '@prisma/config>deepmerge-ts': 8.0.0
  multer: 2.3.0
  'prisma>mysql2': 3.22.6
  proxy-addr: 2.0.8
  sharp: 0.35.5
  source-map-js: 1.2.2

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - multer@2.3.0
  - next@16.3.6
  - proxy-addr@2.0.8
  - sharp@0.35.5
  - source-map-js@1.2.2
